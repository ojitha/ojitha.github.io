<style>
  .video-summary {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    margin: 2rem 0;
    padding: 15px;
    background-color: #f9f9f9;
    border-radius: 8px;
    transition: background-color 0.2s, color 0.2s;
  }

  [data-theme="dark"] .video-summary {
    background-color: #252535;
    color: #c9d1d9;
  }

  .video-summary-caption {
    font-size: 0.8em;
    color: #666;
    display: block;
    margin-bottom: 4px;
  }

  [data-theme="dark"] .video-summary-caption {
    color: #8b949e;
  }

  .video-summary-img {
    max-width: 200px;
    width: 100%;
    height: auto;
    border: 1px solid #ddd;
    border-radius: 4px;
    cursor: pointer;
    transition: transform 0.2s, border-color 0.2s;
  }

  [data-theme="dark"] .video-summary-img {
    border-color: #444;
  }
</style>

<div class="video-summary">

  <div style="flex: 1; min-width: 300px;">
    <div style="position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
      <iframe
        src="https://www.youtube.com/embed/{{ include.id }}"
        style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0;"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen>
      </iframe>
    </div>
  </div>

  <div style="flex: 1; min-width: 250px; display: flex; flex-direction: column;">
    <b>Overview:</b>
    <div style="margin-bottom: 15px; font-size: 0.95em;">
      {{ include.content }}
    </div>

    {% if include.image %}
      <div style="margin-top: auto;">
        <span class="video-summary-caption">Referenced Diagram (Click to enlarge):</span>
        <a href="{{ include.image }}" target="_blank" title="Click to view full diagram">
          <img
            src="{{ include.image }}"
            alt="Summary Diagram"
            class="video-summary-img"
            onmouseover="this.style.transform='scale(1.05)'"
            onmouseout="this.style.transform='scale(1)'"
          >
        </a>
      </div>
    {% endif %}
  </div>

</div>
