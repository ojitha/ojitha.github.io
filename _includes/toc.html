<!-- Floating Table of Contents -->
<div id="floating-toc" class="floating-toc">
  <div id="toc-resize-handle" class="toc-resize-handle" aria-label="Resize TOC"></div>
  <div class="toc-header">
    <span class="toc-title">Table of Contents</span>
    <button id="toc-toggle" class="toc-toggle" type="button"
            aria-controls="toc-content" aria-expanded="true"
            aria-label="Collapse table of contents" title="Collapse table of contents">
      <!-- Reading-progress ring: only visible when the TOC is collapsed -->
      <svg class="toc-ring" viewBox="0 0 44 44" aria-hidden="true">
        <circle class="toc-ring-track" cx="22" cy="22" r="20"/>
        <circle class="toc-ring-bar" id="toc-ring-bar" cx="22" cy="22" r="20"/>
      </svg>
      <!-- List icon: collapsed state -->
      <svg class="toc-icon-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/>
        <line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>
      </svg>
      <!-- Chevrons: expanded state (tuck the panel away to the right) -->
      <svg class="toc-icon-close" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="13 17 18 12 13 7"/><polyline points="6 17 11 12 6 7"/>
      </svg>
    </button>
  </div>
  <nav id="toc-content" class="toc-content">
    <!-- TOC will be generated here by JavaScript -->
  </nav>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  generateTOC();
  setupTOCResize();   // restore the saved width first…
  setupTOCBehavior(); // …so a restored collapsed state can stash and clear it
});

function setupTOCResize() {
  const floatingToc = document.getElementById('floating-toc');
  const handle = document.getElementById('toc-resize-handle');
  if (!floatingToc || !handle) return;

  const MIN_WIDTH = 200;
  const MAX_WIDTH = 700;

  // Restore previously chosen width
  const saved = parseInt(localStorage.getItem('floatingTocWidth'), 10);
  if (!isNaN(saved) && saved >= MIN_WIDTH && saved <= MAX_WIDTH) {
    floatingToc.style.width = saved + 'px';
  }

  let isDragging = false;
  let startX = 0;
  let startWidth = 0;

  function onPointerDown(e) {
    if (floatingToc.classList.contains('collapsed')) return;
    isDragging = true;
    startX = e.clientX;
    startWidth = floatingToc.getBoundingClientRect().width;
    document.body.style.userSelect = 'none';
    document.body.style.cursor = 'ew-resize';
    e.preventDefault();
  }

  function onPointerMove(e) {
    if (!isDragging) return;
    // Dragging left increases width (TOC is anchored to the right)
    const delta = startX - e.clientX;
    let newWidth = startWidth + delta;
    if (newWidth < MIN_WIDTH) newWidth = MIN_WIDTH;
    if (newWidth > MAX_WIDTH) newWidth = MAX_WIDTH;
    floatingToc.style.width = newWidth + 'px';
  }

  function onPointerUp() {
    if (!isDragging) return;
    isDragging = false;
    document.body.style.userSelect = '';
    document.body.style.cursor = '';
    const finalWidth = parseInt(floatingToc.style.width, 10);
    if (!isNaN(finalWidth)) {
      localStorage.setItem('floatingTocWidth', String(finalWidth));
    }
  }

  handle.addEventListener('mousedown', onPointerDown);
  document.addEventListener('mousemove', onPointerMove);
  document.addEventListener('mouseup', onPointerUp);

  // Touch support
  handle.addEventListener('touchstart', function(e) {
    if (e.touches.length !== 1) return;
    onPointerDown(e.touches[0]);
  }, { passive: false });
  document.addEventListener('touchmove', function(e) {
    if (!isDragging || e.touches.length !== 1) return;
    onPointerMove(e.touches[0]);
    e.preventDefault();
  }, { passive: false });
  document.addEventListener('touchend', onPointerUp);
  document.addEventListener('touchcancel', onPointerUp);
}

function generateTOC() {
  const tocContent = document.getElementById('toc-content');
  const headings = document.querySelectorAll('.post-content h1, .post-content h2, .post-content h3, .post-content h4, .post-content h5, .post-content h6');
  
  if (headings.length === 0) {
    document.getElementById('floating-toc').style.display = 'none';
    return;
  }

  const tocList = document.createElement('ul');
  tocList.className = 'toc-list';

  headings.forEach((heading, index) => {
    // Create an ID for the heading if it doesn't have one
    if (!heading.id) {
      heading.id = 'heading-' + index;
    }

    const listItem = document.createElement('li');
    listItem.className = 'toc-item toc-' + heading.tagName.toLowerCase();
    
    const link = document.createElement('a');
    link.href = '#' + heading.id;
    link.textContent = heading.textContent;
    link.className = 'toc-link';
    
    // Smooth scroll behavior
    link.addEventListener('click', function(e) {
      e.preventDefault();
      const target = document.getElementById(heading.id);
      if (target) {
        target.scrollIntoView({
          behavior: 'smooth',
          block: 'start'
        });
        
        // Update active link
        document.querySelectorAll('.toc-link').forEach(l => l.classList.remove('active'));
        link.classList.add('active');
      }
    });
    
    listItem.appendChild(link);
    tocList.appendChild(listItem);
  });

  tocContent.appendChild(tocList);
}

function setupTOCBehavior() {
  const floatingToc = document.getElementById('floating-toc');
  const tocToggle = document.getElementById('toc-toggle');
  const tocContent = document.getElementById('toc-content');
  
  if (!floatingToc || !tocToggle || !tocContent) return;
  
  // Toggle TOC visibility
  const ringBar = document.getElementById('toc-ring-bar');
  const RING_C = 2 * Math.PI * 20; // circumference for r=20
  let readPct = 0;
  let savedInlineWidth = '';

  function setLabel(isCollapsed) {
    const label = isCollapsed
      ? 'Show table of contents (' + readPct + '% read)'
      : 'Collapse table of contents';
    tocToggle.setAttribute('aria-label', label);
    tocToggle.setAttribute('title', label);
    tocToggle.setAttribute('aria-expanded', String(!isCollapsed));
  }

  function setCollapsed(isCollapsed) {
    tocContent.classList.toggle('collapsed', isCollapsed);
    floatingToc.classList.toggle('collapsed', isCollapsed);
    if (isCollapsed) {
      // Stash the user-resized width and clear it so the collapsed CSS wins
      if (floatingToc.style.width) savedInlineWidth = floatingToc.style.width;
      floatingToc.style.width = '';
    } else if (savedInlineWidth) {
      floatingToc.style.width = savedInlineWidth;
    }
    setLabel(isCollapsed);
    try { localStorage.setItem('floatingTocCollapsed', isCollapsed ? '1' : '0'); } catch (e) {}
  }

  tocToggle.addEventListener('click', function() {
    setCollapsed(!floatingToc.classList.contains('collapsed'));
  });

  // Restore the reader's last choice (after the resize code applied the saved width)
  let startCollapsed = false;
  try { startCollapsed = localStorage.getItem('floatingTocCollapsed') === '1'; } catch (e) {}
  if (startCollapsed) setCollapsed(true);

  // Reading progress through the post body, drawn on the collapsed ring
  const article = document.querySelector('.post-content');
  if (ringBar) ringBar.style.strokeDasharray = RING_C.toFixed(2);
  function updateProgress() {
    if (!article || !ringBar) return;
    const rect = article.getBoundingClientRect();
    const total = rect.height - window.innerHeight;
    let p = total > 0 ? -rect.top / total : (rect.top < 0 ? 1 : 0);
    p = Math.min(1, Math.max(0, p));
    ringBar.style.strokeDashoffset = (RING_C * (1 - p)).toFixed(2);
    const pct = Math.round(p * 100);
    if (pct !== readPct) {
      readPct = pct;
      if (floatingToc.classList.contains('collapsed')) setLabel(true);
    }
  }
  updateProgress();
  window.addEventListener('resize', updateProgress);

  // Highlight current section while scrolling
  const headings = document.querySelectorAll('.post-content h1, .post-content h2, .post-content h3, .post-content h4, .post-content h5, .post-content h6');
  const tocLinks = document.querySelectorAll('.toc-link');

  const tocContentEl = document.getElementById('toc-content');
  let lastActiveHref = '';
  let userIsInteractingWithToc = false;
  let userInteractionTimer = null;
  if (tocContentEl) {
    // If the user manually scrolls / interacts with the TOC, pause auto-follow briefly
    const markInteracting = function() {
      userIsInteractingWithToc = true;
      clearTimeout(userInteractionTimer);
      userInteractionTimer = setTimeout(function() {
        userIsInteractingWithToc = false;
      }, 1500);
    };
    tocContentEl.addEventListener('wheel', markInteracting, { passive: true });
    tocContentEl.addEventListener('touchstart', markInteracting, { passive: true });
    tocContentEl.addEventListener('mousedown', markInteracting);
  }

  function scrollActiveIntoView(activeLink) {
    if (!tocContentEl || !activeLink || userIsInteractingWithToc) return;
    const containerRect = tocContentEl.getBoundingClientRect();
    const linkRect = activeLink.getBoundingClientRect();
    const margin = 24;
    if (linkRect.top < containerRect.top + margin) {
      tocContentEl.scrollTop += (linkRect.top - containerRect.top) - margin;
    } else if (linkRect.bottom > containerRect.bottom - margin) {
      tocContentEl.scrollTop += (linkRect.bottom - containerRect.bottom) + margin;
    }
  }

  function updateActiveLink() {
    let current = '';

    headings.forEach(heading => {
      const rect = heading.getBoundingClientRect();
      if (rect.top <= 100) {
        current = heading.id;
      }
    });

    let activeLink = null;
    tocLinks.forEach(link => {
      link.classList.remove('active');
      if (link.getAttribute('href') === '#' + current) {
        link.classList.add('active');
        activeLink = link;
      }
    });

    const href = activeLink ? activeLink.getAttribute('href') : '';
    if (href !== lastActiveHref) {
      lastActiveHref = href;
      scrollActiveIntoView(activeLink);
    }
  }

  // Update active link on scroll with throttling
  let ticking = false;
  window.addEventListener('scroll', function() {
    if (!ticking) {
      requestAnimationFrame(function() {
        updateActiveLink();
        updateProgress();
        ticking = false;
      });
      ticking = true;
    }
  });

  // Initial active link
  setTimeout(updateActiveLink, 100);
}
</script>
