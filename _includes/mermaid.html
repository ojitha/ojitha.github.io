<style>
  /* Mermaid diagram zoom/pan wrapper */
  .mermaid-zoom-wrapper {
    position: relative;
    overflow: hidden;
    border: 1px solid #e4e4e4;
    border-radius: 6px;
    margin: 1em auto; /* centred in the column, so it grows evenly both ways */
    background: #fff;
    min-height: 60px;
    max-width: 100%;
    touch-action: none; /* prevent the page from stealing pinch/scroll inside the wrapper */
    transition: background 0.2s, border-color 0.2s;
  }

  [data-theme="dark"] .mermaid-zoom-wrapper {
    background: #1e1e2e;
    border-color: #333;
  }
  /* The <pre class="mermaid"> inherits minima's pre padding/border/margin,
     which shifts the SVG off the wrapper's origin and crops the diagram
     (the wrapper height is computed from the SVG aspect ratio alone). */
  .mermaid-zoom-wrapper > .mermaid {
    margin: 0 !important;
    padding: 0 !important;
    border: 0 !important;
    background: transparent !important;
    overflow: visible !important;
    text-align: left;
    line-height: 0;
  }
  .mermaid-zoom-wrapper svg {
    cursor: grab;
    transform-origin: top left;
    display: block;
    max-width: none !important; /* allow zooming past default max */
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  .mermaid-zoom-wrapper svg.mz-grabbing {
    cursor: grabbing;
  }

  /* 3×3 control grid — top-left corner, fades unless hovered/focused */
  .mermaid-controls {
    position: absolute;
    top: 8px;
    left: 8px;
    display: grid;
    grid-template-columns: repeat(3, 28px);
    grid-template-rows: repeat(3, 28px);
    gap: 2px;
    z-index: 50;
    opacity: 0.5;
    transition: opacity 0.2s;
    touch-action: manipulation; /* responsive taps without 300ms delay */
  }
  .mermaid-zoom-wrapper:hover .mermaid-controls,
  .mermaid-zoom-wrapper:focus-within .mermaid-controls {
    opacity: 1;
  }
  .mermaid-controls button {
    width: 28px;
    height: 28px;
    border: 1px solid #bbb;
    background: rgba(255,255,255,0.92);
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
    line-height: 1;
    padding: 0;
    color: #444;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .mermaid-controls button:hover {
    background: #f0f0f0;
    border-color: #888;
    color: #111;
  }

  [data-theme="dark"] .mermaid-controls button {
    background: rgba(40, 40, 60, 0.92);
    border-color: #555;
    color: #ccc;
  }
  [data-theme="dark"] .mermaid-controls button:hover {
    background: #3a3a5a;
    border-color: #888;
    color: #fff;
  }
  .mermaid-controls .mz-placeholder {
    width: 28px;
    height: 28px;
  }
  /* Collapsed (toggle off): only the toggle (top-left cell) is shown. */
  .mermaid-controls:not(.mz-open) > :not(.mz-toggle) {
    visibility: hidden;
    pointer-events: none;
  }
  .mermaid-controls:not(.mz-open) {
    pointer-events: none; /* let drags on the hidden cells reach the diagram */
  }
  .mermaid-controls .mz-toggle {
    pointer-events: auto;
  }
  .mermaid-controls.mz-open .mz-toggle {
    background: #e6eefc;
    border-color: #6b8fd6;
    color: #1d4fa8;
  }
  [data-theme="dark"] .mermaid-controls.mz-open .mz-toggle {
    background: #2f3f66;
    border-color: #7b9be0;
    color: #fff;
  }

  /* Larger touch targets for coarse-pointer devices that still show controls
     (e.g. tablets / touch laptops where the viewport is wide enough). */
  @media (pointer: coarse) and (min-width: 601px) {
    .mermaid-controls {
      grid-template-columns: repeat(3, 44px);
      grid-template-rows: repeat(3, 44px);
      gap: 4px;
      opacity: 0.85;
    }
    .mermaid-controls button {
      width: 44px;
      height: 44px;
      font-size: 18px;
    }
    .mermaid-controls .mz-placeholder {
      width: 44px;
      height: 44px;
    }
  }

  /* Mobile (phones): no zoom/pan wrapper at all (see isMobile() in the
     script) — the diagram renders inline, scaled to the column width, and
     touches scroll the page normally. */
  @media (max-width: 600px) {
    pre.mermaid {
      background: transparent;
      border: 0;
      padding: 0;
      text-align: center;
      line-height: normal;
    }
    pre.mermaid > svg {
      max-width: 100% !important;
      height: auto;
    }
  }

  /* Custom render-error box (replaces Mermaid's built-in red error SVG) */
  .mermaid-error {
    padding: 12px 14px;
    border: 1px solid #e3a3a3;
    border-radius: 6px;
    background: #fff5f5;
    color: #a33;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 13px;
    line-height: 1.4;
  }
  .mermaid-error-title {
    font-weight: 600;
    margin-bottom: 6px;
  }
  .mermaid-error-message {
    margin-bottom: 8px;
    white-space: pre-wrap;
  }
  .mermaid-error-source {
    margin: 0;
    background: #fff;
    border: 1px solid #eee;
    border-radius: 4px;
    padding: 8px;
    font-size: 12px;
    overflow-x: auto;
    white-space: pre;
    color: #555;
  }

  [data-theme="dark"] .mermaid-error {
    background: #2a1a1a;
    border-color: #663333;
    color: #ff9999;
  }
  [data-theme="dark"] .mermaid-error-source {
    background: #1e1e2e;
    border-color: #444;
    color: #ccc;
  }
</style>

<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@12.0.0/dist/mermaid.esm.min.mjs';

  // ── Theme helpers ──────────────────────────────────────────────────────────
  function getMermaidTheme() {
    return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'base';
  }

  function initMermaid() {
    mermaid.initialize({
      startOnLoad: false,
      securityLevel: 'loose',
      theme: getMermaidTheme(),
      logLevel: 'error',
      darkMode: getMermaidTheme() === 'dark',
      suppressErrorRendering: true, // don't let Mermaid draw its own error SVG
      parseError(err, hash) { console.error('Mermaid Parse Error:', err, hash); },
    });
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // Render a single .mermaid element ourselves so we control what appears
  // on the page when parsing/rendering fails, instead of Mermaid's own
  // red "Syntax error" box (which is what surfaces the "12.0.0" text —
  // that's just Mermaid's version number baked into its default error UI).
  async function renderOneDiagram(el, idx) {
    let src = el.getAttribute('data-mermaid-src');
    if (!src) {
      src = el.textContent.trim();
      el.setAttribute('data-mermaid-src', src);
    }

    try {
      const { svg, bindFunctions } = await mermaid.render(`mermaid-diagram-${idx}`, src);
      el.innerHTML = svg;
      el.removeAttribute('data-mermaid-error');
      if (bindFunctions) bindFunctions(el);
    } catch (err) {
      console.error('Mermaid render error:', err);
      el.setAttribute('data-mermaid-error', 'true');
      el.innerHTML =
        `<div class="mermaid-error">` +
          `<div class="mermaid-error-title">⚠ Diagram failed to render</div>` +
          `<div class="mermaid-error-message">${escapeHtml(err.message || String(err))}</div>` +
          `<pre class="mermaid-error-source">${escapeHtml(src)}</pre>` +
        `</div>`;
    }
  }

  async function renderAllDiagrams() {
    const nodes = [...document.querySelectorAll('.mermaid')];
    for (let i = 0; i < nodes.length; i++) {
      await renderOneDiagram(nodes[i], i);
    }
  }

  mermaid.registerIconPacks([
    {
      name: 'logos',
      loader: () =>
        fetch('https://unpkg.com/@iconify-json/logos@1/icons.json').then((res) => res.json()),
    },
  ]);

  // Convert fenced code blocks (```mermaid) into .mermaid pre elements
  document.querySelectorAll('pre > code.language-mermaid').forEach((codeBlock) => {
    codeBlock.parentElement.outerHTML = `<pre class="mermaid">${codeBlock.textContent}</pre>`;
  });

  // Store original source on each diagram element before mermaid replaces it
  document.querySelectorAll('.mermaid').forEach((el) => {
    el.setAttribute('data-mermaid-src', el.textContent.trim());
  });

  // ── Initial render ─────────────────────────────────────────────────────────
  initMermaid();
  await renderAllDiagrams();

  // ── Zoom/pan wrapper ───────────────────────────────────────────────────────
  // Phones get the plain, width-fitted SVG instead of the zoom/pan wrapper.
  const mobileQuery = window.matchMedia('(max-width: 600px)');
  const isMobile = () => mobileQuery.matches;

  function wrapWithZoom(el) {
    if (isMobile()) return;
    const svg = el.querySelector('svg');
    if (!svg) return;

    // Wrap the element in a zoom container
    const wrapper = document.createElement('div');
    wrapper.className = 'mermaid-zoom-wrapper';
    el.parentNode.insertBefore(wrapper, el);
    wrapper.appendChild(el);

    // Use viewBox for reliable natural dimensions (getBoundingClientRect height
    // can be 0 or wrong when the SVG hasn't fully laid out yet)
    const vb   = svg.viewBox.baseVal;
    const origW = (vb && vb.width  > 0) ? vb.width  : svg.getBoundingClientRect().width;
    const origH = (vb && vb.height > 0) ? vb.height : svg.getBoundingClientRect().height;
    const aspect = origH / origW;   // height-to-width ratio, always preserved

    // Force the SVG to render at its natural origW × origH so transform: scale()
    // has a predictable basis. Mermaid's default useMaxWidth:true sets the SVG
    // to width:100% with max-width:<origW>px, which means the SVG already fills
    // its container and our scale math would shrink an already-fitted diagram
    // a second time (visible as a tiny diagram inside a full-width wrapper).
    svg.removeAttribute('width');
    svg.removeAttribute('height');
    svg.style.width    = origW + 'px';
    svg.style.height   = origH + 'px';
    svg.style.maxWidth = 'none';

    let scale = 1;
    let tx = 0, ty = 0;
    const ZOOM_STEP   = 0.15;
    const PAN_STEP    = 50;
    const SCALE_MIN   = 0.2;
    const SCALE_MAX   = 5;
    const WHEEL_STEP  = 1.1;

    // If the diagram is wider than the available column on first paint,
    // start fit-to-width so phones see the whole thing on load.
    const parentW0 = (wrapper.parentElement && wrapper.parentElement.clientWidth) || origW;
    if (origW > parentW0) scale = parentW0 / origW;

    function applyTransform() {
      const desiredW = origW * scale;
      const parentW  = (wrapper.parentElement && wrapper.parentElement.clientWidth) || desiredW;
      const w        = Math.min(desiredW, parentW); // never overflow the column
      const h        = w * aspect;
      // Keep the scaled diagram covering the viewport. The wrapper grows from
      // its top-left corner while the diagram fits the column, so zooming
      // about any other point would push the top of the diagram out of view
      // and leave empty space at the bottom. Clamping the translation pins
      // the diagram to the wrapper while it fits (tx = ty = 0, so it grows
      // proportionally) and stops panning past the edges once it overflows.
      tx = Math.min(0, Math.max(w - desiredW, tx));
      ty = Math.min(0, Math.max(h - origH * scale, ty));
      svg.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
      wrapper.style.width  = w + 'px';
      wrapper.style.height = Math.round(h) + 'px';
    }

    // Diagram coordinates (unscaled) of a viewport point.
    function toDiagram(clientX, clientY) {
      const r = wrapper.getBoundingClientRect();
      return { x: (clientX - r.left - tx) / scale, y: (clientY - r.top - ty) / scale };
    }

    // Set the scale, let the wrapper resize (it is centred in the column, so
    // its left edge moves as it grows), then translate so that diagram point
    // `p` lands on the viewport point returned by `target(rect)`.
    function scaleAndPlace(nextScale, p, target) {
      scale = Math.max(SCALE_MIN, Math.min(SCALE_MAX, nextScale));
      applyTransform(); // resizes the wrapper
      const r = wrapper.getBoundingClientRect();
      const t = target(r);
      tx = t.x - r.left - p.x * scale;
      ty = t.y - r.top  - p.y * scale;
      applyTransform(); // clamps to the edges
    }

    // Zoom keeping the diagram point under (clientX, clientY) under it.
    function zoomAt(clientX, clientY, nextScale) {
      scaleAndPlace(nextScale, toDiagram(clientX, clientY),
                    () => ({ x: clientX, y: clientY }));
    }

    // Zoom keeping whatever is at the centre of the view at the centre of the
    // (resized) view — used by the +/− buttons.
    function zoomCentre(nextScale) {
      const r = wrapper.getBoundingClientRect();
      scaleAndPlace(nextScale,
                    toDiagram(r.left + r.width / 2, r.top + r.height / 2),
                    (nr) => ({ x: nr.left + nr.width / 2, y: nr.top + nr.height / 2 }));
    }

    function makeBtn(symbol, title, handler) {
      const b = document.createElement('button');
      b.textContent = symbol;
      b.title = title;
      b.setAttribute('aria-label', title);
      b.addEventListener('click', (e) => { e.stopPropagation(); handler(); });
      return b;
    }

    function placeholder() {
      const d = document.createElement('div');
      d.className = 'mz-placeholder';
      return d;
    }

    // Build 3×3 grid:  [⚙  ↑  +]   (⚙ toggles the other cells)
    //                  [←  ↺  →]
    //                  [·  ↓  −]
    const controls = document.createElement('div');
    controls.className = 'mermaid-controls mz-open'; // pad starts open

    // Top-left cell: toggle that shows/hides the rest of the pad.
    const toggle = makeBtn('✕', 'Hide diagram controls', () => {
      const open = controls.classList.toggle('mz-open');
      const label = open ? 'Hide diagram controls' : 'Show diagram controls';
      toggle.textContent = open ? '✕' : '⚙';
      toggle.title = label;
      toggle.setAttribute('aria-label', label);
      toggle.setAttribute('aria-expanded', String(open));
    });
    toggle.classList.add('mz-toggle');
    toggle.setAttribute('aria-expanded', 'true');

    const cells = [
      toggle,
      makeBtn('↑', 'Pan up',    () => { ty += PAN_STEP; applyTransform(); }),
      makeBtn('+', 'Zoom in',   () => zoomCentre(scale + ZOOM_STEP)),
      makeBtn('←', 'Pan left',  () => { tx += PAN_STEP; applyTransform(); }),
      makeBtn('↺', 'Reset',     () => {
        const pW = (wrapper.parentElement && wrapper.parentElement.clientWidth) || origW;
        scale = origW > pW ? pW / origW : 1;
        tx = 0; ty = 0;
        applyTransform();
      }),
      makeBtn('→', 'Pan right', () => { tx -= PAN_STEP; applyTransform(); }),
      placeholder(),
      makeBtn('↓', 'Pan down',  () => { ty -= PAN_STEP; applyTransform(); }),
      makeBtn('−', 'Zoom out',  () => zoomCentre(scale - ZOOM_STEP)),
    ];
    cells.forEach(c => controls.appendChild(c));
    wrapper.appendChild(controls);

    // ----- Pointer Events: unified mouse / touch / pen --------------------
    // Track every active pointer so we can detect single-pointer drag vs
    // two-pointer pinch from the same event stream.
    const pointers = new Map();
    let pan       = null; // { ox, oy } anchor for single-pointer drag
    let pinchStart = null; // snapshot at the start of a 2-pointer gesture

    const midpoint = () => {
      const [a, b] = [...pointers.values()];
      return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    };
    const distance = () => {
      const [a, b] = [...pointers.values()];
      return Math.hypot(a.x - b.x, a.y - b.y);
    };

    svg.addEventListener('pointerdown', (e) => {
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      try { svg.setPointerCapture(e.pointerId); } catch (_) {}

      if (pointers.size === 1) {
        pan = { ox: e.clientX - tx, oy: e.clientY - ty };
        svg.classList.add('mz-grabbing');
      } else if (pointers.size === 2) {
        pan = null;
        const mid = midpoint();
        pinchStart = {
          dist: distance(),
          scale,
          p: toDiagram(mid.x, mid.y), // diagram point under the fingers
        };
      }
      e.preventDefault();
    });

    svg.addEventListener('pointermove', (e) => {
      if (!pointers.has(e.pointerId)) return;
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

      if (pointers.size === 1 && pan) {
        tx = e.clientX - pan.ox;
        ty = e.clientY - pan.oy;
        applyTransform();
        // Re-anchor to the clamped offset so dragging back from an edge
        // responds immediately instead of after a dead zone.
        pan.ox = e.clientX - tx;
        pan.oy = e.clientY - ty;
      } else if (pointers.size === 2 && pinchStart) {
        const newDist = distance();
        const newMid  = midpoint();
        // Keep the diagram point that started under the fingers under the
        // live midpoint — combines pinch-zoom with two-finger pan.
        scaleAndPlace(pinchStart.scale * (newDist / pinchStart.dist),
                      pinchStart.p, () => newMid);
      }
    });

    function endPointer(e) {
      if (!pointers.has(e.pointerId)) return;
      pointers.delete(e.pointerId);
      try { svg.releasePointerCapture(e.pointerId); } catch (_) {}

      if (pointers.size < 2) pinchStart = null;
      if (pointers.size === 0) {
        pan = null;
        svg.classList.remove('mz-grabbing');
      } else if (pointers.size === 1) {
        // Lift one finger after a pinch → resume single-pointer drag cleanly.
        const p = [...pointers.values()][0];
        pan = { ox: p.x - tx, oy: p.y - ty };
      }
    }
    svg.addEventListener('pointerup',     endPointer);
    svg.addEventListener('pointercancel', endPointer);

    // ----- Wheel / trackpad zoom around the cursor ------------------------
    wrapper.addEventListener('wheel', (e) => {
      // Only intercept zoom-style wheels: ctrl/cmd + wheel, or pinch on a
      // trackpad (which the browser reports as ctrlKey). Plain vertical
      // scrolling is left to the page so users can still scroll past the
      // diagram on desktop.
      if (!e.ctrlKey && !e.metaKey) return;
      e.preventDefault();
      const factor = e.deltaY < 0 ? WHEEL_STEP : 1 / WHEEL_STEP;
      zoomAt(e.clientX, e.clientY, scale * factor);
    }, { passive: false });

    // Re-clamp wrapper width if the column resizes (orientation change, etc.)
    if (typeof ResizeObserver !== 'undefined' && wrapper.parentElement) {
      const ro = new ResizeObserver(() => applyTransform());
      ro.observe(wrapper.parentElement);
      wrapper._cleanupResize = () => ro.disconnect();
    } else {
      window.addEventListener('resize', applyTransform);
      wrapper._cleanupResize = () => window.removeEventListener('resize', applyTransform);
    }

    applyTransform();
  } // end wrapWithZoom

  // Wrap all freshly-rendered diagrams
  document.querySelectorAll('.mermaid').forEach(wrapWithZoom);

  // ── Re-render when dark/light mode toggles ────────────────────────────────
  async function rerenderMermaid() {
    // Unwrap zoom containers and restore original mermaid source text
    document.querySelectorAll('.mermaid-zoom-wrapper').forEach((wrapper) => {
      const el = wrapper.querySelector('.mermaid');
      if (!el) return;
      const src = el.getAttribute('data-mermaid-src');
      if (src) {
        el.removeAttribute('data-processed');
        el.textContent = src;
      }
      if (wrapper._cleanupResize) wrapper._cleanupResize();
      wrapper.parentNode.insertBefore(el, wrapper);
      wrapper.remove();
    });

    initMermaid();
    await renderAllDiagrams();
    document.querySelectorAll('.mermaid').forEach(wrapWithZoom);
  }

  // Watch <html data-theme> for changes triggered by the toggle button
  new MutationObserver((mutations) => {
    for (const m of mutations) {
      if (m.attributeName === 'data-theme') {
        rerenderMermaid();
        break;
      }
    }
  }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  // Add or drop the zoom wrapper when the viewport crosses the phone breakpoint
  // (rotation, window resize). Re-rendering restores Mermaid's own sizing,
  // which wrapWithZoom overrides with fixed pixel dimensions.
  mobileQuery.addEventListener('change', rerenderMermaid);
</script>
