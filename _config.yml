# Site-wide Jekyll configuration.
# Not reloaded while `jekyll serve` runs: restart the server after editing.
# Development overrides live in _config_dev.yml.

# ── Site ────────────────────────────────────────────────────────────────────
title: Ojitha Hewa Kumanayaka
description: >-
  AWS Certified Data & AI/ML Engineer from Australia.
author:
  name: Ojitha Hewa Kumanayak
  email: "ojithak@gmail.com"
  twitter: ojitha
lang: en-AU
timezone: Australia/Sydney
url: "https://ojitha.github.io"
baseurl: ""
copyright: "Copyright © 2020 Ojitha Hewa Kumanayaka"
google_analytics: G-85WM1QYKXW

# ── SEO (jekyll-seo-tag) ────────────────────────────────────────────────────
twitter:
  username: ojitha
  card: summary_large_image
social:
  name: Ojitha Hewa Kumanayaka
  links:
    - https://github.com/ojitha
    - https://twitter.com/ojitha
    - https://www.linkedin.com/in/ojitha
    - https://stackoverflow.com/users/546792

# ── Front matter defaults ───────────────────────────────────────────────────
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

# ── Theme ───────────────────────────────────────────────────────────────────
remote_theme: jekyll/minima@4de322363fca5927e6f4012cb94f6dad69ab5e6c
minima:
  # v3 reads the nav list from minima.nav_pages (v2 used site.header_pages).
  nav_pages:
    - index.html
    - blog.md
    - notes.md
    - mindmap.html
    - projects.md
    - about.md
  # `auto` follows prefers-color-scheme; `classic` forces light, `dark` forces dark.
  skin: auto
  # v3 format: array of {icon, url, title}. The v2 hash form (twitter: ojitha)
  # renders blank icons in v3.
  social_links:
    - { icon: github,         url: "https://github.com/ojitha",              title: "GitHub" }
    - { icon: x-twitter,      url: "https://twitter.com/ojitha",             title: "Twitter / X" }
    - { icon: linkedin,       url: "https://www.linkedin.com/in/ojitha",     title: "LinkedIn" }
    - { icon: stack-overflow, url: "https://stackoverflow.com/users/546792", title: "Stack Overflow" }

# ── Content ─────────────────────────────────────────────────────────────────
show_excerpts: true
excerpt_separator: <!--more-->
paginate: 5

feed:
  excerpt_only: true

# ── Markdown & maths ────────────────────────────────────────────────────────
markdown: kramdown
kramdown:
  auto_ids: true
  math_engine: mathjax
  hard_wrap: false
  syntax_highlighter: rouge

mathjax:
  source: https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js
  config: 'MathJax.typesetPromise'

# ── Comments (giscus, https://giscus.app) ───────────────────────────────────
# Rendered on posts only when repo_id and category_id are both set;
# opt a post out with `comments: false`.
giscus:
  repo: ojitha/ojitha.github.io
  repo_id: MDEwOlJlcG9zaXRvcnkyNjMwMjEzOTg=
  category: Announcements
  category_id: "DIC_kwDOD61jVs4DKooS"
  mapping: pathname
  reactions_enabled: "1"
  input_position: bottom
  light_theme: light
  dark_theme: dark
  lang: en

# ── Search (Algolia) ────────────────────────────────────────────────────────
algolia:
  application_id: 247I9HI0FJ
  index_name: ojitha_github_io
  search_only_api_key: c0e739fba2a9fa6f1de62c04507daf1d
  files_to_exclude:
    - index.html
    - blog.md

# ── Plugins ─────────────────────────────────────────────────────────────────
# _config_dev.yml overrides this list; keep jekyll-remote-theme in both.
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-paginate
  - jekyll-algolia
  - jemoji
  - jekyll-remote-theme

# ── Build exclusions ────────────────────────────────────────────────────────
exclude:
  - skill-usage.md
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - exec
  - jekyll
  - build
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
